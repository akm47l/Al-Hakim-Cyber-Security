name: Catalog audit

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate catalog structure
        run: python3 Scripts/validate_catalog.py

      - name: Check official links and repository metadata
        id: audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/audit_catalog.py --save

      - name: Commit audit snapshot and automated upstream metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Database/tools.json Database/sources.json Updates/history/
          if git diff --cached --quiet; then
            echo 'No catalog audit changes to commit.'
          else
            git commit -m 'chore: record catalog audit snapshot'
            git push
          fi
